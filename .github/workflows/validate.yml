name: Validate PAUSE

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python
        run: python -m py_compile bridge.py relay.py
      - name: Test aggregation and privacy
        run: python -m unittest discover -s tests -v
      - name: Validate browser script
        run: |
          node --check v2.js
          node --check remote.js
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('controller.html',):
              script = re.search(r'<script>(.*?)</script>', Path(name).read_text(), re.S).group(1)
              Path('/tmp/pause-inline.js').write_text(script)
          PY
          node --check /tmp/pause-inline.js
      - name: Validate Apple property lists
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          for item in Path('ios').rglob('*.plist'):
              with item.open('rb') as f:
                  plistlib.load(f)
              print("Validated", item)
          PY
      - name: Verify V2 wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          assert 'window.PauseBoard={display,closePanel}' in html
          assert '<script src="v2.js"></script>' in html
          assert '<link rel="stylesheet" href="v2.css">' in html
          print('Board integration OK')
          PY
