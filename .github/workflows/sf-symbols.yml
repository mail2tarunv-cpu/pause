name: Audit PAUSE SF Symbols

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "macos/**"
      - "scripts/audit_sf_symbols.cjs"
      - "scripts/validate_sf_symbols.swift"
      - "scripts/generate_app_icons.swift"
      - ".github/workflows/sf-symbols.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sf-symbols:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Render shared PAUSE launcher icons
        run: swift scripts/generate_app_icons.swift
      - name: Collect symbol identifiers from native SwiftUI screens
        run: |
          node scripts/audit_sf_symbols.cjs > /tmp/pause-sf-symbols.txt
          cat /tmp/pause-sf-symbols.txt
      - name: Verify each symbol resolves on Apple's system
        run: swift scripts/validate_sf_symbols.swift /tmp/pause-sf-symbols.txt
