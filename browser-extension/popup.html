<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAUSE</title><link rel="stylesheet" href="popup.css"></head><body>
<main>
  <div class="top"><strong>PAUSE</strong><span>ATTENTION BRIDGE</span></div>
  <h1>Watch less.<br>Notice more.</h1>
  <p class="description">Share the active website's domain with PAUSE on this Mac. No browsing history, paths or titles.</p>
  <label for="code">PAIRING CODE FROM PAUSE FOR MAC</label>
  <input id="code" spellcheck="false" autocomplete="off" type="password" maxlength="48" placeholder="48-character local pairing code">
  <div class="row">
    <button id="connect" class="primary">Pair / Test</button>
    <button id="forget">Forget</button>
  </div>
  <div class="toggle"><div><b>Website tracking</b><small>Only while this browser is active</small></div><input type="checkbox" id="enabled" aria-label="Website tracking enabled"></div>
  <div class="status"><span id="led"></span><span id="statusText">Not paired</span></div>
  <div class="small" id="site">No site received</div>
  <a href="options.html" target="_blank">Privacy and setup</a>
</main><script src="popup.js"></script></body></html>
