name: PAUSECompanion
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PAUSECompanion:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
    entitlements:
      path: App/PAUSE.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pause
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: PAUSEMonitor
      - target: PAUSEReport
  PAUSEMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - Shared
    info:
      path: Monitor/Info.plist
    entitlements:
      path: Monitor/PAUSEMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pause.Monitor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
  PAUSEReport:
    type: app-extension
    platform: iOS
    sources:
      - Report
    info:
      path: Report/Info.plist
    entitlements:
      path: Report/PAUSEReport.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pause.Report
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
