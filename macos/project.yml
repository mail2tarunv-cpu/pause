name: PAUSEMac
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  PAUSEMac:
    type: application
    platform: macOS
    sources:
      - App
      - path: ../assets/fonts/SpaceGrotesk-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/SpaceGrotesk-Medium.ttf
        buildPhase: resources
      - path: ../assets/fonts/SpaceGrotesk-Bold.ttf
        buildPhase: resources
      - path: ../assets/fonts/DMMono-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/DMMono-Medium.ttf
        buildPhase: resources
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pause.mac
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
